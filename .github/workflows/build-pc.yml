name: Build PC Release (Windows)

# 트리거:
# 1. v로 시작하는 태그 푸시 (v1.0.0-beta.1 등) → 자동 빌드 + GitHub Release 생성
# 2. Actions 페이지에서 수동 실행 (workflow_dispatch) → 빌드 후 artifact만 업로드
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'GitHub Release에 업로드'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Release 생성·업로드용

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 22 설정
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 의존성 설치 (ECONNRESET 대비 3회 재시도)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $maxAttempts = 3
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "▶ npm ci 시도 $i/$maxAttempts"
            npm ci --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -eq 0) { Write-Host "✅ 의존성 설치 성공"; exit 0 }
            Write-Host "⚠ 시도 $i 실패 (exit $LASTEXITCODE). 5초 후 재시도..."
            Start-Sleep -Seconds 5
          }
          Write-Host "❌ $maxAttempts 회 모두 실패"
          exit 1

      - name: 앱 아이콘 재생성 (선택)
        run: npm run icons
        continue-on-error: true

      - name: Windows .exe 빌드 (publish 제외)
        run: npm run dist:win
        shell: pwsh

      - name: ⭐ Artifact 업로드 (publish 성공·실패 무관 — 무조건 보존)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          retention-days: 14
          if-no-files-found: warn

      - name: GitHub Release 생성·업로드 (이미 빌드된 dist 파일 첨부)
        if: success() && (github.event_name == 'push' || inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
